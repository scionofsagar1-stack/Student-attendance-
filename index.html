      <div style={authStyles.card}>
        <div style={authStyles.title}>ATTENDANCE REGISTER</div>
        <div style={authStyles.tabRow}>
          <button style={{ ...authStyles.tabBtn, ...(mode === "staff" ? authStyles.tabBtnActive : {}) }} onClick={() => setMode("staff")}>Admin/Custodian</button>
          <button style={{ ...authStyles.tabBtn, ...(mode === "candidate" ? authStyles.tabBtnActive : {}) }} onClick={() => setMode("candidate")}>Candidate</button>
        </div>

        {mode === "staff" ? (
          <>
            <div style={authStyles.subtitle}>Log in to access your attendance data</div>
            <input style={authStyles.input} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()} autoCapitalize="off" autoCorrect="off" />
            <input style={authStyles.input} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()} />

            {err && <div style={authStyles.error}>{err}</div>}
            {blockedError && <div style={authStyles.error}>{blockedError}</div>}

            <button style={authStyles.primaryBtn} onClick={submit} disabled={loading}>
              {loading ? "Please wait…" : "Login"}
            </button>
          </>
        ) : (
          <>
            <div style={authStyles.subtitle}>Enter your name and 4-digit PIN</div>
            <input style={authStyles.input} placeholder="Your full name" value={cName} onChange={(e) => setCName(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && cPin.length === 4 && submitCandidate()} autoFocus />
            <input style={{ ...authStyles.input, textAlign: "center", letterSpacing: 8 }} type="password" inputMode="numeric" maxLength={4}
              placeholder="PIN" value={cPin} onChange={(e) => setCPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
              onKeyDown={(e) => e.key === "Enter" && submitCandidate()} />

            {cErr && <div style={authStyles.error}>{cErr}</div>}

            <button style={authStyles.primaryBtn} onClick={submitCandidate} disabled={cLoading || !cName.trim() || cPin.length !== 4}>
              {cLoading ? "Please wait…" : "Login"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}


function CandidateSelfScreen({ client, candidate, onLogout }) {
  // geochecking | ready | selfie | submitting | success | already | error
  const alreadyMarked = candidate.classInfo && candidate.classInfo.alreadyPresent;
  const markedAbsent = candidate.classInfo && !alreadyMarked && candidate.classInfo.attendanceStatus === "A";
  const [stage, setStage] = useState(alreadyMarked ? "already" : "ready");
  const [message, setMessage] = useState(
    alreadyMarked
      ? `You're already marked Present today${candidate.classInfo.presentTime ? ` (${candidate.classInfo.presentTime})` : ""}.`
      : (markedAbsent ? "You've been marked Absent today. Contact your Admin/Custodian to change this." : "")
  );
  const [coords, setCoords] = useState(null);

  const needsGeo = candidate.classInfo && candidate.classInfo.locationOn !== false && candidate.classInfo.geoCenter && candidate.classInfo.geoCenter.lat != null;
  const needsSelfie = !candidate.classInfo || candidate.classInfo.selfieOn !== false;

  const startCheckin = async () => {
    setMessage("");
    if (needsGeo) {
      setStage("geochecking");
      try {
        const pos = await getCurrentPositionAsync();
        const dist = distanceMeters(
          pos.coords.latitude, pos.coords.longitude,
          candidate.classInfo.geoCenter.lat, candidate.classInfo.geoCenter.lng
        );
        if (dist > (candidate.classInfo.geoRadius || 150)) {
          setMessage("You are outside the classroom area — move closer and try again.");
          setStage("error");
          return;
        }
        setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      } catch (err) {
        setMessage("Could not get location access — turn on permission and try again.");
        setStage("error");
        return;
      }
    } else {
      setCoords(null);
    }
    if (needsSelfie) {
      setStage("selfie");
    } else {
      finishCheckin(null);
    }
  };

  const finishCheckin = async (selfieDataUrl) => {
    setStage("submitting");
    setMessage("");
    try {
      const dateStr = todayISO();
      const timeStr = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
      const { data, error } = await client.rpc("self_checkin_by_pin", {
        p_name: candidate.name, p_pin: candidate.pin, p_date: dateStr, p_time: timeStr,
        p_lat: coords ? coords.lat : null, p_lng: coords ? coords.lng : null,
        p_selfie: selfieDataUrl || null,
      });
      if (error) {
        setMessage("Something went wrong — try again. [" + error.message + "]");
        setStage("error");
      } else if (data && data.alreadyPresent) {
        setMessage(`You're already marked Present today${data.time ? ` (${data.time})` : ""}.`);
        setStage("already");
      } else if (data && data.success) {
        setMessage(`${data.name}'s attendance is marked ✅`);
        setStage("success");
      } else {
        setMessage((data && data.message) || "Name or PIN did not match.");
        setStage("error");
      }
    } catch (e) {
      setMessage("Something went wrong: " + (e && e.message ? e.message : e));
      setStage("error");
    }
  };

  return (
    <div style={authStyles.wrap}>
      <div style={authStyles.card}>
        <div style={authStyles.title}>🎓 {candidate.name}</div>

        {stage === "ready" && (
          <>
            {message && <div style={authStyles.error}>{message}</div>}
            {markedAbsent ? (
              <div style={authStyles.info}>🔒 Contact your Admin/Custodian to mark you Present.</div>
            ) : (
              <button style={authStyles.primaryBtn} onClick={startCheckin}>Mark Present</button>
            )}
          </>
        )}

        {stage === "geochecking" && <div style={authStyles.info}>📍 Checking your location, please wait…</div>}
        {stage === "submitting" && <div style={authStyles.info}>⏳ Please wait…</div>}
        {stage === "success" && <div style={authStyles.checkinSuccessBox}>✅ {message}</div>}
        {stage === "already" && <div style={authStyles.info}>ℹ️ {message}</div>}
        {stage === "error" && (
          <>
            <div style={authStyles.error}>{message}</div>
            <button style={authStyles.primaryBtn} onClick={() => setStage("ready")}>Try again</button>
          </>
        )}

        <a href="#" onClick={(e) => { e.preventDefault(); onLogout(); }} style={authStyles.checkinLink}>← Logout</a>
      </div>

      {stage === "selfie" && (
        <SelfieCaptureModal
          studentName={candidate.name}
          onCapture={(dataUrl) => finishCheckin(dataUrl)}
          onCancel={() => setStage("ready")}
        />
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("App crashed:", error, info && info.componentStack);
  }
  render() {
    if (this.state.error) {
      const msg = (this.state.error && this.state.error.message) ? this.state.error.message : String(this.state.error);
      return (
        <div style={{ maxWidth: 640, margin: "24px auto", padding: "18px 20px", background: "#fdece7", border: "1px solid #f0cfc5", borderRadius: 10, color: "#7a2f20", fontFamily: "'Inter', sans-serif" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Something went wrong — the app crashed.</div>
          <div style={{ whiteSpace: "pre-wrap", fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", marginBottom: 14, lineHeight: 1.5 }}>{msg}</div>
          <button
            onClick={() => window.location.reload()}
            style={{ background: "#E8C468", color: "#1F3D2B", border: "none", borderRadius: 7, padding: "9px 16px", fontWeight: 700, fontSize: 12.5, cursor: "pointer", fontFamily: "'Inter', sans-serif" }}
          >
            Reload App
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function Root() {
  const [sbConfig, setSbConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [signupClient, setSignupClient] = useState(null);
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [profile, setProfile] = useState(undefined); // undefined = checking, null = blocked, {role,...} = ok
  const [authBlockedMsg, setAuthBlockedMsg] = useState("");
  const [checkingConfig, setCheckingConfig] = useState(true);
  const [teacherOptions, setTeacherOptions] = useState([]);
  const [viewAsUserId, setViewAsUserId] = useState(""); // "" = apna data, otherwise a teacher's user id
  const [candidate, setCandidate] = useState(null); // { name, pin, classInfo } once candidate-logged-in

  useEffect(() => {
    if (EMBEDDED_SUPABASE_URL && EMBEDDED_SUPABASE_ANON_KEY) {
      setSbConfig({ url: EMBEDDED_SUPABASE_URL, anonKey: EMBEDDED_SUPABASE_ANON_KEY });
    }
    setCheckingConfig(false);
  }, []);

  useEffect(() => {
    if (!sbConfig) return;
    try {
      const c = window.supabase.createClient(sbConfig.url, sbConfig.anonKey);
      setClient(c);
      // Separate, non-session-persisting client — purely so the admin can
      // create a class teacher's login (signUp) without getting signed out
      // of their own admin session in the process.
      setSignupClient(
        window.supabase.createClient(sbConfig.url, sbConfig.anonKey, {
          auth: { persistSession: false, autoRefreshToken: false },
        })
      );
      c.auth.getSession().then(({ data }) => setSession(data.session || null));
      const { data: sub } = c.auth.onAuthStateChange((_event, sess) => {
        setSession(sess || null);
      });
      return () => sub && sub.subscription && sub.subscription.unsubscribe();
    } catch (e) {
      setSession(null);
    }
  }, [sbConfig]);

  // Load the `profiles` row that decides admin vs class-teacher access.
  // If nobody has a profile yet (brand new project), the very first person
  // to log in automatically becomes admin — after that, only the admin can
  // create further (class teacher) logins from inside the app.
  useEffect(() => {
    if (!client || !session) {
      if (session === null) setProfile(null);
      return;
    }
    let cancelled = false;
    (async () => {
      setProfile(undefined);
      const { data: existing, error: existingErr } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (existing) {
        setProfile(existing);
        return;
      }
      if (existingErr) {
        setAuthBlockedMsg("Error while checking profile. [Debug: " + existingErr.message + (existingErr.code ? " (code: " + existingErr.code + ")" : "") + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        return;
      }
      // No profile row yet — try to bootstrap as the first admin. This only
      // succeeds (per RLS) if the profiles table is still completely empty.
      const { data: inserted, error: insertErr } = await client
        .from("profiles")
        .insert({ id: session.user.id, email: session.user.email, role: "admin" })
        .select()
        .maybeSingle();
      if (cancelled) return;
      if (!insertErr && inserted) {
        setProfile(inserted);
        return;
      }
      // A row for this id may already exist (e.g. an earlier attempt actually
      // succeeded but this check missed it) — re-fetch before giving up.
      if (insertErr && insertErr.code === "23505") {
        const { data: retryExisting } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
        if (cancelled) return;
        if (retryExisting) {
          setProfile(retryExisting);
          return;
        }
      }
      {
        const detail = insertErr ? (insertErr.message + (insertErr.code ? " (code: " + insertErr.code + ")" : "")) : "Row was not inserted.";
        setAuthBlockedMsg("This account is not authorized by admin. Ask your school admin to create your Entity Custodian login. [Debug: " + detail + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
      }
    })();
    return () => { cancelled = true; };
  }, [client, session]);

  // Agar admin kisi teacher ka access hata de (profiles row delete kar de),
  // to jo teacher pehle se logged in hai uska session bhi jald khatam ho —
  // so we re-verify the profile from time to time and when tab regains focus.
  useEffect(() => {
    if (!client || !session || !profile) return;
    const revalidate = async () => {
      const { data: still, error } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (error || !still) {
        setAuthBlockedMsg("Your access has been removed by admin. Please contact your school admin.");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        setViewAsUserId("");
      }
    };
    const interval = setInterval(revalidate, 20000);
    const onVisible = () => { if (document.visibilityState === "visible") revalidate(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, [client, session, profile]);

  // List of teacher accounts for Admin — used for the "which teacher's data
  // to view/edit" dropdown. Actual access is governed by RLS (is_admin()),
  // this list is just for display in the UI.
  useEffect(() => {
    if (!client || !profile || profile.role !== "admin") {
      setTeacherOptions([]);
      return;
    }
    let cancelled = false;
    client.from("profiles").select("*").eq("role", "teacher").order("created_at", { ascending: false }).then(({ data }) => {
      if (!cancelled && data) setTeacherOptions(data);
    });
    return () => { cancelled = true; };
  }, [client, profile]);

  const handleLogout = async () => {
    if (client) await client.auth.signOut();
    setSession(null);
    setProfile(null);
    setViewAsUserId("");
  };

  if (checkingConfig) return null;

  if (!sbConfig) {
    return (
      <div style={authStyles.wrap}>
        <div style={authStyles.card}>
          <div style={authStyles.title}>Supabase Not Configured</div>
          <div style={authStyles.subtitle}>The app isn't connected to a Supabase project yet. The developer needs to set the URL and anon key.</div>
        </div>
      </div>
    );
  }

  if (!client || session === undefined) return null;

  if (candidate) {
    return <CandidateSelfScreen client={client} candidate={candidate} onLogout={() => setCandidate(null)} />;
  }

  if (!session) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} onCandidateLoggedIn={setCandidate} />;
  }

  if (profile === undefined) return null; // checking profile/role

  if (!profile) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} onCandidateLoggedIn={setCandidate} />;
  }

  const effectiveUserId = (profile.role === "admin" && viewAsUserId) ? viewAsUserId : session.user.id;
  window.storage = makeSupabaseStorage(client, effectiveUserId);

  const isAdmin = profile.role === "admin";
  const isTeacher = profile.role === "teacher";
  const viewingTeacher = isAdmin && viewAsUserId ? teacherOptions.find((t) => t.id === viewAsUserId) : null;
  const userLabel = viewingTeacher
    ? `Admin: ${session.user.email}`
    : isTeacher
    ? `Entities Custodian: ${session.user.email}`
    : session.user.email;
  const lockedTimeMode = viewingTeacher ? !!viewingTeacher.time_mode : (isTeacher ? !!profile.time_mode : null);
  // Admin always has full Supabase import access. A custodian (teacher) only
  // gets it if the admin has explicitly switched it on for their login —
  // when the admin is "viewing as" a custodian, admin's own access still wins.
  const canImport = isAdmin || (isTeacher && !!profile.can_import);

  return (
    <AttendanceApp
      key={effectiveUserId}
      userEmail={userLabel}
      isGuest={isTeacher}
      isAdmin={isAdmin}
      canImport={canImport}
      client={client}
      signupClient={signupClient}
      onLogout={handleLogout}
      teacherOptions={teacherOptions}
      viewAsUserId={viewAsUserId}
      onChangeViewAs={setViewAsUserId}
      viewingTeacherEmail={viewingTeacher ? viewingTeacher.email : null}
      lockedTimeMode={lockedTimeMode}
    />
  );
}

  const root = ReactDOM.createRoot(document.getElementById("root"));

</script>

<script>
  // Manually transform + run the app source (instead of Babel's silent auto-scan of
  // type="text/babel" tags) so that ANY build/syntax error is guaranteed to surface
  // in the on-screen boot-error box, not just get swallowed into the console.
  (function () {
    const sourceEl = document.getElementById("app-source");
    const src = sourceEl.textContent;
    function showBootError(label, err) {
      const box = document.getElementById("boot-error");
      if (!box) return;
      box.style.display = "block";
      let detail = err && err.message ? err.message : String(err);
      if (err && err.loc) detail += "\n(line " + err.loc.line + ", col " + err.loc.column + ")";
      box.textContent = label + ": " + detail;
      console.error(label, err);
    }
    try {
      const { code } = Babel.transform(src, { presets: ["react"], filename: "app-source.jsx" });
      try {
        (0, eval)(code);
      } catch (runErr) {
        showBootError("App run error", runErr);
      }
    } catch (buildErr) {
      showBootError("Build error", buildErr);
    }
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("Service worker register failed:", err);
      });
    });
  }
</script>
