<script>
  // ---- surface any error on-screen instead of a silent blank page ----
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    if (box) {
      box.style.display = "block";
      box.textContent = "Page load error: " + (e.message || e.error) +
        (e.filename ? "\n(" + e.filename + ":" + e.lineno + ")" : "") +
        "\n\nAgar ye CDN se related error hai to internet connection check karo, ya browser console (F12) khol kar poora error dekho.";
    }
  });

  // ---- storage polyfill (localStorage-backed, mirrors the window.storage API) ----
  window.storage = {
    get: async (key, shared) => {
      try {
        const v = localStorage.getItem(key);
        if (v === null || v === undefined) return null;
        return { key, value: v, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    set: async (key, value, shared) => {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    delete: async (key, shared) => {
      try {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    list: async (prefix, shared) => {
      try {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
  };
</script>

        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        {...rest}

        {paths}

    );
  };
}

const SELFIE_RETENTION_DAYS = 45;

const pruneOldSelfies = (selfies) => {
  if (!selfies) return {};
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - SELFIE_RETENTION_DAYS);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  const result = {};
  Object.keys(selfies).forEach((dateStr) => {
    if (dateStr >= cutoffStr) result[dateStr] = selfies[dateStr];
  });
  return result;
};

// distance (meters) between two lat/lng points
const distanceMeters = (lat1, lon1, lat2, lon2) => {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
};
const getCurrentPositionAsync = (opts) =>
  new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("Geolocation not supported")); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, opts || { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  });

// "8:15 am" / "08:15 AM" jaise stamped time ko minutes-since-midnight me convert karta hai
const parseTimeToMinutes = (t) => {
  if (!t) return null;
  const m = String(t).trim().match(/^(\d{1,2}):(\d{2})\s*([ap]m)?$/i);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ap = m[3] ? m[3].toLowerCase() : null;
  if (ap === "pm" && h !== 12) h += 12;
  if (ap === "am" && h === 12) h = 0;
  return h * 60 + min;
};
// lateTime "HH:MM" (24hr, <input type="time"> se) ke against stamped time check karta hai
const isLateStamp = (stampedTime, lateTimeStr) => {
  if (!lateTimeStr || !stampedTime) return false;
  const lm = String(lateTimeStr).trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!lm) return false;
  const lateMinutes = parseInt(lm[1], 10) * 60 + parseInt(lm[2], 10);
  const stampMinutes = parseTimeToMinutes(stampedTime);
  return stampMinutes !== null && stampMinutes > lateMinutes;
};

/* ---------------- searchable student picker (replaces plain <select> where lists can get long) ---------------- */
function StudentSearchSelect({ students, value, onChange, placeholder = "Koi candidate nahi", style }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", onDocClick);
    document.addEventListener("touchstart", onDocClick);
    return () => {
      document.removeEventListener("mousedown", onDocClick);
      document.removeEventListener("touchstart", onDocClick);
    };
  }, [open]);

  useEffect(() => {
    if (open) {
      setQ("");
      setTimeout(() => inputRef.current && inputRef.current.focus(), 30);
    }
  }, [open]);

  const selected = students.find((s) => s.id === value);
  const filtered = students.filter((s) => {
    const t = q.trim().toLowerCase();
    return !t || s.name.toLowerCase().includes(t) || String(s.roll).toLowerCase().includes(t);
  });

  return (
    <div ref={wrapRef} style={{ position: "relative", flex: 1, minWidth: 0, ...style }}>
      <button
        type="button"
        style={styles.selectInput}
        onClick={() => setOpen((v) => !v)}
      >
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
          {selected ? `${selected.roll} — ${selected.name}` : (students.length === 0 ? placeholder : "Candidate chuno")}
        </span>
        <ChevronRight size={14} style={{ transform: "rotate(90deg)", flexShrink: 0, marginLeft: 6 }} />
      </button>

      {open && (
        <div style={styles.dropdownPanel}>
          <div style={{ ...styles.searchRow, marginBottom: 0, borderRadius: 0, border: "none", borderBottom: "1px solid #d8cfae" }}>
            <SearchIcon size={15} color="#b3a889" style={{ flexShrink: 0 }} />
            <input
              ref={inputRef}
              style={styles.searchInput}
              placeholder="Naam ya roll se search karo…"
              value={q}
              onChange={(e) => setQ(e.target.value)}
            />
            {q && (
              <button style={styles.searchClearBtn} onClick={() => setQ("")} aria-label="Clear search"><X size={14} /></button>
            )}
          </div>
          <div style={styles.dropdownList}>
            {filtered.length === 0 ? (
              <div style={{ ...styles.empty, padding: "14px 12px" }}>"{q}" se koi candidate nahi mila.</div>
            ) : (
              filtered.map((s) => (
                <div
                  key={s.id}
                  style={{ ...styles.dropdownOption, ...(s.id === value ? styles.dropdownOptionActive : {}) }}
                  onClick={() => { onChange(s.id); setOpen(false); }}
                >
                  {s.roll} — {s.name}
                </div>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- simple camera selfie capture (proof photo, no liveness claim) ---------------- */
function SelfieCaptureModal({ studentName, onCapture, onCancel }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [status, setStatus] = useState("starting"); // starting | ready | error
  const [errMsg, setErrMsg] = useState("");

  useEffect(() => {
    let cancelled = false;
    navigator.mediaDevices
      ?.getUserMedia({ video: { facingMode: "user" }, audio: false })
      .then((stream) => {
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play().catch(() => {});
        }
        setStatus("ready");
      })
      .catch((err) => {
        if (cancelled) return;
        setStatus("error");
        setErrMsg(err && err.message ? err.message : "Camera access nahi mil paaya.");
      });
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, []);

  const stopStream = () => {
    if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
  };

  const capture = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement("canvas");
    const size = 240;
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");
    const vw = video.videoWidth, vh = video.videoHeight;
    const side = Math.min(vw, vh);
    ctx.save();
    ctx.translate(size, 0);
    ctx.scale(-1, 1); // mirror, feels natural for a front camera
    ctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, size, size);
    ctx.restore();
    const dataUrl = canvas.toDataURL("image/jpeg", 0.55);
    stopStream();
    onCapture(dataUrl);
  };

  const cancel = () => {
    stopStream();
    onCancel();
  };

  return (
    <div style={styles.modalOverlay} className="no-print">
      <div style={styles.selfieCard}>
        <div style={styles.selfieTitle}>📸 {studentName} ki selfie proof</div>
        <div style={styles.selfieSub}>Present dabate hi ek photo save hogi (proof ke liye — ye liveness-verified nahi hai).</div>
        <div style={styles.selfieFrame}>
          {status === "error" ? (
            <div style={styles.selfieErrorBox}>
              Camera nahi khul paaya.<br />
              <span style={{ fontSize: 10.5, opacity: 0.8 }}>{errMsg}</span>
            </div>
          ) : (
            <video ref={videoRef} playsInline muted style={{ ...styles.selfieVideo, transform: "scaleX(-1)" }} />
          )}
          {status === "starting" && <div style={styles.selfieLoadingTag}>Camera khul raha hai…</div>}
        </div>
        <div style={styles.selfieBtnRow}>
          <button style={styles.selfieCancelBtn} onClick={cancel}>Cancel</button>
          <button style={styles.selfieCaptureBtn} onClick={capture} disabled={status !== "ready"}>
            <Camera size={15} style={{ marginRight: 6, verticalAlign: -3 }} />Capture &amp; Present maaro
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- per-student PIN gate (used on the guest/teacher device before marking or removing Present) ---------------- */
function PinPromptModal({ studentName, expectedPin, mode, onSuccess, onCancel }) {
  const [pin, setPin] = useState("");
  const [wrong, setWrong] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current && inputRef.current.focus();
  }, []);

  const submit = () => {
    if (pin === expectedPin) {
      onSuccess();
    } else {
      setWrong(true);
      setPin("");
    }
  };

  return (
    <div style={styles.modalOverlay} className="no-print">
      <div style={styles.pinCard}>
        <div style={styles.selfieTitle}>🔒 {studentName} ka PIN daalo</div>
        <div style={styles.selfieSub}>{mode === "remove" ? "Present hataane" : "Present lagane"} ke liye apna 4-digit PIN daalo.</div>
        <input
          ref={inputRef}
          type="password"
          inputMode="numeric"
          maxLength={4}
          value={pin}
          onChange={(e) => { setWrong(false); setPin(e.target.value.replace(/\D/g, "").slice(0, 4)); }}
          onKeyDown={(e) => e.key === "Enter" && pin.length === 4 && submit()}
          style={styles.pinInput}
          placeholder="••••"
        />
        {wrong && <div style={styles.pinWrongMsg}>Galat PIN, dobara koshish karo.</div>}
        <div style={styles.selfieBtnRow}>
          <button style={styles.selfieCancelBtn} onClick={onCancel}>Cancel</button>
          <button style={styles.selfieCaptureBtn} onClick={submit} disabled={pin.length !== 4}>Confirm</button>
        </div>
      </div>
    </div>
  );
}

  const [lateTimeEditing, setLateTimeEditing] = useState(false);
  const [selfieTarget, setSelfieTarget] = useState(null);
  const [viewingSelfie, setViewingSelfie] = useState(null);
  const [pinTarget, setPinTarget] = useState(null);
  const [geoRadiusDraft, setGeoRadiusDraft] = useState(150);
  const [geoSaving, setGeoSaving] = useState(false);
  const [geoSetupError, setGeoSetupError] = useState("");
  const [geoCheckingId, setGeoCheckingId] = useState(null);
  const [geoBlockedFor, setGeoBlockedFor] = useState(null);
  const [linkCopied, setLinkCopied] = useState(false);

  const [newRoll, setNewRoll] = useState("");
  const [newName, setNewName] = useState("");
  const [bulkText, setBulkText] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editRoll, setEditRoll] = useState("");
  const [editName, setEditName] = useState("");
  const [editPin, setEditPin] = useState("");
  const [saveError, setSaveError] = useState(false);
  const [justStamped, setJustStamped] = useState(null);
  const nameInputRef = useRef(null);

  // ---- load + migrate ----
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.classes && data.classes.length) {
            setClasses(normalizeClasses(data.classes));
            setActiveClassId(data.activeClassId || data.classes[0].id);
          } else {
            const c = blankClass();
            setClasses([c]);
            setActiveClassId(c.id);
          }
        } else {
          let migrated = null;
          try {
            const old = await window.storage.get("attendance-app-store-v1", false);
            if (old && old.value) {
              const od = JSON.parse(old.value);
              if (od.students || od.attendance) {
                migrated = blankClass(od.classInfo?.className || "");
                migrated.teacher = od.classInfo?.teacher || "";
                migrated.students = od.students || [];
                migrated.attendance = od.attendance || {};
              }
            }
          } catch (e) {}
          const c = migrated || blankClass();
          setClasses([c]);
          setActiveClassId(c.id);
        }
      } catch (e) {
        const c = blankClass();
        setClasses([c]);
        setActiveClassId(c.id);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const payload = JSON.stringify({ classes, activeClassId });
        const result = await window.storage.set(STORAGE_KEY, payload, false);
        setSaveError(!result);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [classes, activeClassId, loaded]);

  const activeClass = classes.find((c) => c.id === activeClassId) || null;
  const students = activeClass ? activeClass.students : [];
  const activeStudents = students.filter((s) => s.active !== false);
  const attendance = activeClass ? activeClass.attendance : {};
  const holidays = activeClass ? (activeClass.holidays || {}) : {};
  const attendanceTimes = activeClass ? (activeClass.attendanceTimes || {}) : {};
  const attendanceSelfies = activeClass ? (activeClass.attendanceSelfies || {}) : {};
  const lateTime = activeClass ? (activeClass.lateTime || "") : "";
  const geoCenter = activeClass ? (activeClass.geoCenter || null) : null;
  const geoRadius = activeClass ? (activeClass.geoRadius || 150) : 150;
  const checkinCode = activeClass ? (activeClass.checkinCode || "") : "";
  const classInfo = { className: activeClass ? activeClass.className : "", teacher: activeClass ? activeClass.teacher : "" };

  const matchesSearch = (s, q) => !q.trim() || s.name.toLowerCase().includes(q.trim().toLowerCase()) || String(s.roll).toLowerCase().includes(q.trim().toLowerCase());
  const enrollListShown = students.filter((s) => matchesSearch(s, enrollSearch));
  const registerListShown = activeStudents.filter((s) => matchesSearch(s, registerSearch));

  const updateActive = (patchFn) => {
    setClasses((prev) => prev.map((c) => (c.id === activeClassId ? { ...c, ...patchFn(c) } : c)));
  };
  const setStudents = (updater) =>
    updateActive((c) => ({ students: typeof updater === "function" ? updater(c.students) : updater }));
  const setAttendance = (updater) =>
    updateActive((c) => ({ attendance: typeof updater === "function" ? updater(c.attendance) : updater }));
  const setHolidays = (updater) =>
    updateActive((c) => ({ holidays: typeof updater === "function" ? updater(c.holidays || {}) : updater }));
  const setAttendanceTimes = (updater) =>
    updateActive((c) => ({ attendanceTimes: typeof updater === "function" ? updater(c.attendanceTimes || {}) : updater }));
  const setAttendanceSelfies = (updater) =>
    updateActive((c) => ({ attendanceSelfies: typeof updater === "function" ? updater(c.attendanceSelfies || {}) : updater }));
  const setLateTime = (val) => updateActive(() => ({ lateTime: val }));
  const setGeoCenter = (val) => updateActive(() => ({ geoCenter: val }));
  const setGeoRadius = (val) => updateActive(() => ({ geoRadius: val }));
  const setCheckinCode = (val) => updateActive(() => ({ checkinCode: val }));
  const toggleHoliday = (dateStr, label) => {
    setHolidays((prev) => {
      const next = { ...prev };
      if (next[dateStr]) {
        delete next[dateStr];
      } else {
        next[dateStr] = label && label.trim() ? label.trim() : "Chutti";
      }
      return next;
    });
  };
  const setClassInfo = (updater) =>
    updateActive((c) => {
      const cur = { className: c.className, teacher: c.teacher };
      const next = typeof updater === "function" ? updater(cur) : updater;
      return { className: next.className, teacher: next.teacher };
    });

  const startEditClassField = (field) => {
    setClassFieldDraft(classInfo[field] || "");
    setEditingClassField(field);
  };
  const saveClassField = () => {
    if (!editingClassField) return;
    const field = editingClassField;
    setClassInfo((p) => ({ ...p, [field]: classFieldDraft.trim() }));
    setEditingClassField(null);
    setClassFieldDraft("");
  };
  const cancelEditClassField = () => {
    setEditingClassField(null);
    setClassFieldDraft("");
  };

  useEffect(() => {
    setEditingClassField(null);
    setClassFieldDraft("");
    setEnrollSearch("");
    setRegisterSearch("");
    setGridSearch("");
    setShowHolidayForm(false);
    setHolidayDraft("");
    setLateTimeEditing(false);
  }, [activeClassId]);

  useEffect(() => {
    setShowHolidayForm(false);
    setHolidayDraft("");
  }, [selectedDate]);

  useEffect(() => {
    if (!selectedStudentId && students.length) setSelectedStudentId(students[0].id);
    if (selectedStudentId && !students.find((s) => s.id === selectedStudentId)) {
      setSelectedStudentId(students.length ? students[0].id : "");
    }
  }, [students, activeClassId]); // eslint-disable-line

  const addClass = () => {
    const name = newClassName.trim();
    const c = blankClass(name || `Entities ${classes.length + 1}`);
    setClasses((prev) => [...prev, c]);
    setActiveClassId(c.id);
    setNewClassName("");
    setShowNewClassForm(false);
    setView("enrollment");
  };

  const deleteClass = () => {
    if (!activeClass || !isAdmin) return;
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const entered = window.prompt("Entities delete karne ke liye Admin PIN daalo:");
    if (entered === null) return; // cancelled
    if (entered.trim() !== storedPin) {
      window.alert("Galat PIN. Entities delete nahi hui.");
      return;
    }
    const ok = window.confirm(`"${activeClass.className || "Untitled Entities"}" delete karein? Iska poora data (candidates + attendance) mit jaayega.`);
    if (!ok) return;
    setClasses((prev) => {
      const remaining = prev.filter((c) => c.id !== activeClassId);
      const list = remaining.length ? remaining : [blankClass()];
      setActiveClassId(list[0].id);
      return list;
    });
  };

  const changeDeletePin = () => {
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const current = window.prompt("Abhi ka Admin PIN daalo (default: " + DEFAULT_DELETE_PIN + "):");
    if (current === null) return;
    if (current.trim() !== storedPin) {
      window.alert("Galat PIN.");
      return;
    }
    const next = window.prompt("Naya PIN daalo (4-6 digit):");
    if (!next || !next.trim()) return;
    const confirmNext = window.prompt("Naya PIN dobara daalo (confirm):");
    if (next.trim() !== (confirmNext || "").trim()) {
      window.alert("Dono PIN match nahi hue. Kuch nahi badla.");
      return;
    }
    localStorage.setItem(DELETE_PIN_KEY, next.trim());
    window.alert("PIN update ho gaya.");
  };

  /* ---------- Class Teacher logins (admin-only) ----------
     Owner/admin creates a real Supabase Auth login (email + password) for
     each class teacher, exactly like the fee register app. Each teacher's
     data (classes/sections/students/attendance) stays fully isolated —
     Postgres RLS on app_storage already only ever returns rows belonging
     to whoever is logged in — so a teacher only ever sees the class(es)
     they themselves created. */
  const loadTeacherAccounts = async () => {
    if (!client) return;
    const { data, error } = await client
      .from("profiles").select("*").eq("role", "teacher").order("created_at", { ascending: false });
    if (!error && data) setTeacherAccounts(data);
  };

  const createTeacherAccount = async () => {
    const email = teacherForm.email.trim();
    const pwd = teacherForm.password.trim();
    setTeacherPanelError("");
    if (!email || !pwd) {
      setTeacherPanelError("Email aur password dono bharo.");
      return;
    }
    if (pwd.length < 6) {
      setTeacherPanelError("Password kam se kam 6 characters ka rakhein.");
      return;
    }
    setTeacherSaving(true);
    const { data: signUpData, error: signUpError } = await signupClient.auth.signUp({ email, password: pwd });
    if (signUpError || !signUpData.user) {
      setTeacherPanelError(signUpError ? signUpError.message : "Account nahi ban paaya.");
      setTeacherSaving(false);
      return;
    }
    const { error: profileError } = await client.from("profiles").insert({
      id: signUpData.user.id, email, role: "teacher", time_mode: teacherForm.timeMode,
    });
    if (profileError) {
      setTeacherPanelError("Account ban gaya lekin profile save nahi hui — Supabase me 'profiles' table check karein.");
    } else {
      setTeacherLastCreated({ email, password: pwd });
      setTeacherForm({ email: "", password: "", timeMode: false });
      await loadTeacherAccounts();
    }
    setTeacherSaving(false);
  };

  const toggleAccountTimeMode = async (id, next) => {
    setTeacherSaving(true);
    const { error } = await client.from("profiles").update({ time_mode: next }).eq("id", id);
    if (!error) await loadTeacherAccounts();
    setTeacherSaving(false);
  };

  const deleteTeacherAccount = async (id) => {
    const ok = window.confirm("Is entities custodian ka access hataayein? (Login abhi bhi Supabase me rahega, lekin ab kuch access nahi milega.)");
    if (!ok) return;
    setTeacherSaving(true);
    const { error } = await client.from("profiles").delete().eq("id", id);
    if (!error) await loadTeacherAccounts();
    setTeacherSaving(false);
  };

  useEffect(() => {
    if (isAdmin && showTeacherPanel) loadTeacherAccounts();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isAdmin, showTeacherPanel]);

  const nextAutoRoll = (list) => {
    const nums = list.map((s) => parseInt(s.roll, 10)).filter((n) => !isNaN(n));
    return nums.length ? String(Math.max(...nums) + 1) : "1";
  };

  const addStudent = () => {
    const name = newName.trim();
    if (!name) return;
    setStudents((prev) => {
      const roll = newRoll.trim() || nextAutoRoll(prev);
      return [...prev, { id: newId("s"), roll, name, active: true, enrolledAt: todayISO() }].sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }));
    });
    setNewRoll("");
    setNewName("");
    nameInputRef.current && nameInputRef.current.focus();
  };

  const addBulk = () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const today = todayISO();
    setStudents((prev) => {
      let list = [...prev];
      let counter = parseInt(nextAutoRoll(list), 10);
      lines.forEach((line) => {
        let roll, name;
        const m = line.match(/^(\d+)[.)\-\s]+(.*)$/);
        if (m) {
          roll = m[1];
          name = m[2].trim();
        } else {
          roll = String(counter);
          name = line;
        }
        counter = Math.max(counter, parseInt(roll, 10) || 0) + 1;
        list.push({ id: newId("s"), roll, name, active: true, enrolledAt: today });
      });
      return list.sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }));
    });
    setBulkText("");
  };

  const removeStudent = (id, name) => {
    if (!isAdmin) return;
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const entered = window.prompt(`"${name || "Candidate"}" ko delete karne ke liye Admin PIN daalo:`);
    if (entered === null) return; // cancelled
    if (entered.trim() !== storedPin) {
      window.alert("Galat PIN. Candidate delete nahi hua.");
      return;
    }
    setStudents((prev) => prev.filter((s) => s.id !== id));
    setAttendance((prev) => {
      const copy = { ...prev };
      Object.keys(copy).forEach((date) => {
        if (copy[date] && copy[date][id] !== undefined) {
          const dayCopy = { ...copy[date] };
          delete dayCopy[id];
          copy[date] = dayCopy;
        }
      });
      return copy;
    });
  };

  const toggleActive = (id) => {
    setStudents((prev) => prev.map((s) => (s.id === id ? { ...s, active: s.active === false ? true : false } : s)));
  };

  const toggleStar = (id) => {
    if (!isAdmin) return;
    setStudents((prev) => prev.map((s) => (s.id === id ? { ...s, starred: !s.starred } : s)));
  };

  const startEdit = (s) => {
    setEditingId(s.id);
    setEditRoll(s.roll);
    setEditName(s.name);
    setEditPin(s.pin || "");
  };

  const saveEdit = (id) => {
    const cleanPin = editPin.replace(/\D/g, "").slice(0, 4);
    setStudents((prev) =>
      prev
        .map((s) => (s.id === id ? { ...s, roll: editRoll.trim() || s.roll, name: editName.trim() || s.name, pin: isAdmin ? cleanPin : s.pin } : s))
        .sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }))
    );
    setEditingId(null);
  };

  const copyCheckinLink = async () => {
    const url = `${window.location.origin}${window.location.pathname}?checkin=${checkinCode}`;
    try {
      await navigator.clipboard.writeText(url);
      setLinkCopied(true);
      setTimeout(() => setLinkCopied(false), 2000);
    } catch (e) {
      window.prompt("Link copy karo:", url);
    }
  };

  const captureGeoCenter = async () => {
    setGeoSaving(true);
    setGeoSetupError("");
    try {
      const pos = await getCurrentPositionAsync();
      setGeoCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      setGeoRadius(Number(geoRadiusDraft) || 150);
    } catch (err) {
      setGeoSetupError("Location nahi mil paayi — GPS/location permission on karke phir try karo.");
    }
    setGeoSaving(false);
  };

  const markStatus = (studentId, status) => {
    const wasStatus = (attendance[selectedDate] || {})[studentId];
    const willBeSet = wasStatus !== status; // false = user is clearing this status
    setAttendance((prev) => {
      const day = { ...(prev[selectedDate] || {}) };
      day[studentId] = day[studentId] === status ? undefined : status;
      if (day[studentId] === undefined) delete day[studentId];
      return { ...prev, [selectedDate]: day };
    });
    if (teacherMode) {
      setAttendanceTimes((prev) => {
        const day = { ...(prev[selectedDate] || {}) };
        if (status === "P" && willBeSet) {
          day[studentId] = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
        } else {
          delete day[studentId];
        }
        return { ...prev, [selectedDate]: day };
      });
    }
    setJustStamped(studentId + status);
    setTimeout(() => setJustStamped(null), 380);
  };

  const markAllStatus = (status) => {
    if (!activeStudents.length) return;
    setAttendance((prev) => {
      const day = { ...(prev[selectedDate] || {}) };
      activeStudents.forEach((s) => {
        day[s.id] = status;
      });
      return { ...prev, [selectedDate]: day };
    });
  };

  const toggleAllPresent = () => {
    if (!activeStudents.length) return;
    const day = attendance[selectedDate] || {};
    const allPresent = activeStudents.every((s) => day[s.id] === "P");
    setAttendance((prev) => {
      const nextDay = { ...(prev[selectedDate] || {}) };
      activeStudents.forEach((s) => {
        if (allPresent) {
          delete nextDay[s.id];
        } else {
          nextDay[s.id] = "P";
        }
      });
      return { ...prev, [selectedDate]: nextDay };
    });
    if (teacherMode) {
      const stamp = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
      setAttendanceTimes((prev) => {
        const nextDay = { ...(prev[selectedDate] || {}) };
        activeStudents.forEach((s) => {
          if (allPresent) {
            delete nextDay[s.id];
          } else {
            nextDay[s.id] = stamp;
          }
        });
        return { ...prev, [selectedDate]: nextDay };
      });
    }
  };


  const dayRecord = attendance[selectedDate] || {};
  const presentCount = activeStudents.filter((s) => dayRecord[s.id] === "P").length;
  const absentCount = activeStudents.filter((s) => dayRecord[s.id] === "A").length;
  const leaveCount = activeStudents.filter((s) => dayRecord[s.id] === "L").length;
  const markedCount = presentCount + absentCount + leaveCount;
  const pct = activeStudents.length ? Math.round((presentCount / activeStudents.length) * 100) : 0;

  const shiftDate = (deltaDays) => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + deltaDays);
    setSelectedDate(d.toISOString().slice(0, 10));
  };
  const shiftMonth = (delta) => {
    const [y, m] = selectedMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const shiftYear = (delta) => setSelectedYear(String(parseInt(selectedYear, 10) + delta));

  const formatDateLabel = (iso) => {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  };
  const monthLabel = useMemo(() => {
    const [y, m] = selectedMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  }, [selectedMonth]);

  const statsForDates = (studentId, dates) => {
    let present = 0, absent = 0, leave = 0;
    dates.forEach((d) => {
      const st = attendance[d] && attendance[d][studentId];
      if (st === "P") present++;
      else if (st === "A") absent++;
      else if (st === "L") leave++;
    });
    const total = present + absent + leave;
    const percent = total ? Math.round((present / total) * 100) : null;
    return { present, absent, leave, total, percent };
  };
  const datesWithData = (prefix) =>
    Object.keys(attendance).filter((d) => d.startsWith(prefix) && Object.keys(attendance[d] || {}).length > 0);

  // Academic year = April(selectedYear) se March(selectedYear+1) tak.
  const datesInAcademicYear = (startYearStr) => {
    const y = parseInt(startYearStr, 10);
    const startDate = `${y}-04-01`;
    const endDate = `${y + 1}-03-31`;
    return Object.keys(attendance).filter((d) => d >= startDate && d <= endDate && Object.keys(attendance[d] || {}).length > 0);
  };
  const academicYearLabel = (startYearStr) => {
    const y = parseInt(startYearStr, 10);
    if (Number.isNaN(y)) return startYearStr;
    return `${y}-${String((y + 1) % 100).padStart(2, "0")}`;
  };

  const barColor = (p) => (p === null ? "#B8AF98" : p >= 75 ? "#4C8C5B" : p >= 50 ? "#D9A441" : "#C1503D");
  const printReport = () => window.print();

  const monthDates = datesWithData(selectedMonth);
  const monthlyStats = students.map((s) => ({ ...s, ...statsForDates(s.id, monthDates) }));
  const monthClassAvg = (() => {
    const w = monthlyStats.filter((s) => s.percent !== null);
    return w.length ? Math.round(w.reduce((a, s) => a + s.percent, 0) / w.length) : null;
  })();

  const yearDates = datesInAcademicYear(selectedYear);
  const yearlyStats = students.map((s) => ({ ...s, ...statsForDates(s.id, yearDates) }));
  const yearClassAvg = (() => {
    const w = yearlyStats.filter((s) => s.percent !== null);
    return w.length ? Math.round(w.reduce((a, s) => a + s.percent, 0) / w.length) : null;
  })();

  const selectedStudent = students.find((s) => s.id === selectedStudentId);
  const studentMonthRows = useMemo(() => {
    if (!selectedStudentId) return [];
    const startYear = parseInt(selectedYear, 10);
    return ACADEMIC_MONTH_ORDER.map((m) => {
      const yr = m <= 3 ? startYear + 1 : startYear;
      const prefix = `${yr}-${String(m).padStart(2, "0")}`;
      const dates = datesWithData(prefix);
      return { month: MONTH_NAMES[m - 1], ...statsForDates(selectedStudentId, dates) };
    });
  }, [selectedStudentId, selectedYear, attendance]); // eslint-disable-line

  const studentYearTotal = useMemo(() => {
    if (!selectedStudentId) return { present: 0, absent: 0, leave: 0, total: 0, percent: null };
    return statsForDates(selectedStudentId, yearDates);
  }, [selectedStudentId, yearDates]); // eslint-disable-line

  const WEEKDAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const daysInSelectedMonth = useMemo(() => {
    const [y, m] = selectedMonth.split("-").map(Number);
    return new Date(y, m, 0).getDate();
  }, [selectedMonth]);

  const gridRows = useMemo(() => {
    return students.map((s) => {
      const days = [];
      let totalPresent = 0;
      let absentCount = 0;
      let lateCount = 0;
      for (let d = 1; d <= daysInSelectedMonth; d++) {
        const dateStr = `${selectedMonth}-${String(d).padStart(2, "0")}`;
        const st = attendance[dateStr] && attendance[dateStr][s.id];
        if (st === "P") {
          totalPresent++;
          const stampedTime = attendanceTimes[dateStr] && attendanceTimes[dateStr][s.id];
          if (isLateStamp(stampedTime, lateTime)) lateCount++;
        } else if (st === "A") {
          absentCount++;
        }
        days.push(st || null);
      }
      return { ...s, days, totalPresent, absentCount, lateCount };
    });
  }, [students, selectedMonth, daysInSelectedMonth, attendance, attendanceTimes, lateTime]);

  const studentDayList = useMemo(() => {
    if (!selectedStudentId) return [];
    const [y, m] = selectedMonth.split("-").map(Number);
    const rows = [];
    for (let d = 1; d <= daysInSelectedMonth; d++) {
      const dateStr = `${selectedMonth}-${String(d).padStart(2, "0")}`;
      const dObj = new Date(y, m - 1, d);
      const st = attendance[dateStr] && attendance[dateStr][selectedStudentId];
      const stampedTime = st === "P" ? (attendanceTimes[dateStr] && attendanceTimes[dateStr][selectedStudentId]) || null : null;
      rows.push({
        date: dateStr,
        day: d,
        weekday: WEEKDAY_SHORT[dObj.getDay()],
        status: st || null,

                    <div style={styles.printOnlyMainTitle}>Attendance Register</div>
                    <div style={styles.printOnlyMeta}>
                      {classInfo.className && <span>Entities: {classInfo.className}</span>}
                      {classInfo.teacher && <span>Custodian: {classInfo.teacher}</span>}
                      <span>Month: {monthLabel}</span>
                      <span>Legend: P=Present, A=Absent, L=Leave. Shaded column = Holiday</span>
                    </div>
                  </div>

                  {students.length === 0 ? (
                    <div style={styles.empty}>Abhi koi candidate enroll nahi hai.</div>
                  ) : (
                    <>
                      {students.length > 5 && (
                        <div style={styles.searchRow} className="no-print">
                          <SearchIcon size={15} color="#b3a889" style={{ flexShrink: 0 }} />
                          <input
                            style={styles.searchInput}
                            placeholder="Naam ya roll se search karo…"
                            value={gridSearch}
                            onChange={(e) => setGridSearch(e.target.value)}
                          />
                          {gridSearch && (
                            <button style={styles.searchClearBtn} onClick={() => setGridSearch("")} aria-label="Clear search"><X size={14} /></button>
                          )}
                        </div>
                      )}
                      <div className="no-print" style={styles.pdfHint}>{"\u2190"} Left-right scroll karo poori table dekhne ke liye</div>
                      <div style={styles.gridTableWrap} className="print-table">
                        <table style={{ ...styles.gridTable, "--daycols": daysInSelectedMonth }} className="grid-print-table">
                          <thead>
                            <tr>
                              <th style={styles.gridThName} className="grid-name-col">Roll</th>
                              <th style={{ ...styles.gridThName, textAlign: "left" }} className="grid-name-col">Name</th>
                              {Array.from({ length: daysInSelectedMonth }, (_, i) => i + 1).map((d) => {
                                const dateStr = `${selectedMonth}-${String(d).padStart(2, "0")}`;
                                const isHol = holidays[dateStr];
                                return (
                                  <th key={d} style={{ ...styles.gridThDay, ...(isHol ? styles.gridThHoliday : {}) }} className="grid-date-col" title={isHol || undefined}>{d}</th>
                                );
                              })}
                              <th style={styles.gridThTotal}>Total P</th>
                            </tr>
                          </thead>
                          <tbody>
                            {(() => {
                              const rows = gridRows.filter((s) => matchesSearch(s, gridSearch));
                              return rows.map((s, rowIdx) => (
                                <tr key={s.id}>
                                  <td style={styles.gridTdName} className="grid-name-col">{s.roll}</td>
                                  <td style={{ ...styles.gridTdName, textAlign: "left" }} className="grid-name-col">
                                    <div>{s.name}</div>
                                    {(s.lateCount > 0 || s.absentCount > 0) && (
                                      <div style={styles.gridNameSummary}>
                                        {s.lateCount > 0 && <span style={styles.gridNameSummaryLate}>L-{s.lateCount}</span>}
                                        {s.absentCount > 0 && <span style={styles.gridNameSummaryAbsent}>A-{s.absentCount}</span>}
                                      </div>
                                    )}
                                  </td>
                                  {s.days.map((st, i) => {
                                    const d = i + 1;
                                    const dateStr = `${selectedMonth}-${String(d).padStart(2, "0")}`;
                                    const isHol = holidays[dateStr];
                                    if (isHol) {
                                      if (rowIdx !== 0) return null;
                                      return (
                                        <td key={i} rowSpan={rows.length} style={styles.gridTdHoliday} className="grid-holiday-col" title={isHol}>
                                          <div style={styles.gridHolidayCellWrap}>
                                            <div style={styles.gridHolidayDateTag}>{d}</div>
                                            <div style={styles.gridHolidayLabel}>{isHol}</div>
                                          </div>
                                        </td>
                                      );
                                    }
                                    const info = st ? STATUS[st] : null;
                                    const timeVal = teacherMode && st === "P" && attendanceTimes[dateStr] && attendanceTimes[dateStr][s.id];
                                    return (
                                      <td key={i} style={{ ...styles.gridTdDay, color: info ? info.color : "#c9c0a3", fontWeight: info ? 700 : 400 }} className="grid-date-col">
                                        {timeVal ? (
                                          <div style={styles.gridTdTimeVertical}>{fullTimeNoAmPm(timeVal)}</div>
                                        ) : (
                                          <div>{info ? info.short : "·"}</div>
                                        )}
                                      </td>
                                    );
                                  })}
                                  <td style={styles.gridTdTotal}>{s.totalPresent}</td>
                                </tr>
                              ));
                            })()}
                          </tbody>
                        </table>
                      </div>
                      <div className="no-print" style={{ ...styles.pdfHint, marginTop: 6 }}>
                        Legend: <span style={{ color: STATUS.P.color, fontWeight: 700 }}>P</span> Present ·{" "}
                        <span style={{ color: STATUS.A.color, fontWeight: 700 }}>A</span> Absent ·{" "}
                        <span style={{ color: STATUS.L.color, fontWeight: 700 }}>L</span> Leave ·{" "}
                        <span style={{ background: "#fdf3de", border: "1px solid #e8c468", padding: "0 5px", fontWeight: 700, color: "#8a5a1c" }}>▍</span> Holiday/Chutti (naam column me likha hoga)
                        {" · "}Naam ke niche <span style={{ color: "#C1503D", fontWeight: 700 }}>L-x</span> (Late) aur <span style={{ color: "#B23A3A", fontWeight: 700 }}>A-x</span> (Absent) is mahine ka total hai.
                      </div>

                      <div style={styles.summary}>
                        <div style={{ flex: 1 }} />
                        <button style={styles.printBtn} className="no-print" onClick={printReport}><Printer size={14} style={{ marginRight: 5, verticalAlign: -2 }} />Download PDF</button>
                      </div>
                      <div className="no-print" style={styles.landscapeWarn}>
                        ⚠️ Poori table ek page me chahiye to Print dialog khulne par upar "Portrait" wale dropdown/Layout option par tap karke <b>Landscape</b> select karo, fir "Save as PDF" karo. (Android par ye setting app khud set nahi kar sakta, isliye manually badalni padti hai.)
                      </div>
                    </>
                  )}
                </>
              )}
            </>
          )}
        </div>

        {saveError && <div style={styles.errorBanner} className="no-print">Save nahi ho paaya — data sirf is session ke liye hai.</div>}
      </div>

      {selfieTarget && (
        <SelfieCaptureModal
          studentName={selfieTarget.name}
          onCapture={(dataUrl) => {
            markStatus(selfieTarget.id, "P");
            setAttendanceSelfies((prev) => {
              const day = { ...(prev[selectedDate] || {}) };
              day[selfieTarget.id] = dataUrl;
              return { ...prev, [selectedDate]: day };
            });
            setSelfieTarget(null);
          }}
          onCancel={() => setSelfieTarget(null)}
        />
      )}

      {viewingSelfie && (
        <div style={styles.modalOverlay} className="no-print" onClick={() => setViewingSelfie(null)}>
          <div style={styles.selfieViewCard} onClick={(e) => e.stopPropagation()}>
            <img src={viewingSelfie.url} alt={`${viewingSelfie.name} selfie`} style={styles.selfieViewImg} />
            <div style={styles.selfieViewMeta}>
              <div style={styles.selfieViewName}>{viewingSelfie.name}</div>
              <div style={styles.selfieViewSub}>{formatDateLabel(viewingSelfie.date)}{viewingSelfie.time ? ` · ${viewingSelfie.time}` : ""}</div>
            </div>
            <button style={styles.selfieViewCloseBtn} onClick={() => setViewingSelfie(null)}>Band karo</button>
          </div>
        </div>
      )}

      {pinTarget && (
        <PinPromptModal
          studentName={pinTarget.student.name}
          expectedPin={pinTarget.student.pin}
          mode={pinTarget.turningOn ? "mark" : "remove"}
          onSuccess={() => {
            const { student, turningOn } = pinTarget;
            setPinTarget(null);
            if (turningOn) {
              setSelfieTarget(student);
            } else {
              markStatus(student.id, "P");
            }
          }}
          onCancel={() => setPinTarget(null)}
        />
      )}
    </div>
  );
}

function makeSupabaseStorage(client, userId) {
  return {
    get: async (key) => {
      try {
        const { data, error } = await client
          .from("app_storage")
          .select("value")
          .eq("user_id", userId)
          .eq("key", key)
          .maybeSingle();
        if (error || !data) return null;
        return { key, value: data.value };
      } catch (e) {
        return null;
      }
    },
    set: async (key, value) => {
      try {
        const { error } = await client
          .from("app_storage")
          .upsert({ user_id: userId, key, value, updated_at: new Date().toISOString() }, { onConflict: "user_id,key" });
        if (error) return null;
        return { key, value };
      } catch (e) {
        return null;
      }
    },
    delete: async (key) => {
      try {
        const { error } = await client.from("app_storage").delete().eq("user_id", userId).eq("key", key);
        return error ? null : { key, deleted: true };
      } catch (e) {
        return null;
      }
    },
    list: async (prefix) => {
      try {
        let q = client.from("app_storage").select("key").eq("user_id", userId);
        if (prefix) q = q.like("key", prefix + "%");
        const { data, error } = await q;
        if (error) return null;
        return { keys: (data || []).map((r) => r.key), prefix };
      } catch (e) {
        return null;
      }
    },
  };
}

function AuthScreen({ client, onAuthed, blockedError }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    setErr("");
    const em = email.trim();
    if (!em || !password) {
      setErr("Email aur password dono bharo.");
      return;
    }
    if (password.length < 6) {
      setErr("Password kam se kam 6 characters ka ho.");
      return;
    }
    setLoading(true);
    try {
      const { error } = await client.auth.signInWithPassword({ email: em, password });
      if (error) {
        setErr(error.message);
      } else {
        onAuthed();
      }
    } catch (e) {
      setErr("Kuch galat ho gaya: " + (e && e.message ? e.message : e));
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={authStyles.wrap}>
      <div style={authStyles.card}>
        <div style={authStyles.title}>उपस्थिति रजिस्टर</div>
        <div style={authStyles.subtitle}>Login karke apna attendance data access karo</div>

        <input style={authStyles.input} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} autoCapitalize="off" autoCorrect="off" />
        <input style={authStyles.input} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />

        {err && <div style={authStyles.error}>{err}</div>}
        {blockedError && <div style={authStyles.error}>{blockedError}</div>}

        <button style={authStyles.primaryBtn} onClick={submit} disabled={loading}>
          {loading ? "Please wait…" : "Login"}
        </button>

        <a href="?checkin=" style={authStyles.checkinLink}>🎓 Candidate ho? Yahan apni attendance lagao</a>
      </div>
    </div>
  );
}

function SelfCheckinScreen({ client }) {
  const initialCode = (new URLSearchParams(window.location.search).get("checkin") || "").trim().toUpperCase();
  const [code, setCode] = useState(initialCode);
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [stage, setStage] = useState(initialCode ? "form" : "code"); // code | form | success | error
  const [message, setMessage] = useState("");
  const [busy, setBusy] = useState(false);

  const goBack = () => { window.location.href = window.location.pathname; };

  const submitCode = () => {
    const clean = code.trim().toUpperCase();
    if (!clean) return;
    setCode(clean);
    setStage("form");
  };

  const submitAttendance = async () => {
    if (!name.trim() || pin.length !== 4) return;
    setBusy(true);
    setMessage("");
    try {
      const dateStr = todayISO();
      const timeStr = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
      const { data, error } = await client.rpc("self_checkin", {
        p_code: code, p_name: name.trim(), p_pin: pin, p_date: dateStr, p_time: timeStr,
      });
      if (error) {
        setMessage("Kuch gadbad ho gayi — dobara try karo. [" + error.message + "]");
        setStage("error");
      } else if (data && data.success) {
        setMessage(`${data.name} ki attendance lag gayi ✅`);
        setStage("success");
      } else {
        setMessage((data && data.message) || "Naam ya PIN match nahi hua.");
        setStage("error");
      }
    } catch (e) {
      setMessage("Kuch galat ho gaya: " + (e && e.message ? e.message : e));
      setStage("error");
    }
    setBusy(false);
  };

  return (
    <div style={authStyles.wrap}>
      <div style={authStyles.card}>
        <div style={authStyles.title}>🎓 Apni Attendance</div>
        <div style={authStyles.subtitle}>
          {stage === "code" && "Class ka code daalo (jo aapke custodian ne diya hai)."}
          {stage === "form" && "Apna poora naam aur 4-digit PIN daalo."}
          {stage === "success" && "Ho gaya!"}
          {stage === "error" && "Nahi ho paaya."}
        </div>

        {stage === "code" && (
          <>
            <input style={{ ...authStyles.input, textAlign: "center", letterSpacing: 3, textTransform: "uppercase" }} placeholder="CODE"
              value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} onKeyDown={(e) => e.key === "Enter" && submitCode()} />
            <button style={authStyles.primaryBtn} onClick={submitCode} disabled={!code.trim()}>Aage badho</button>
          </>
        )}

        {stage === "form" && (
          <>
            <input style={authStyles.input} placeholder="Apna poora naam" value={name}
              onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && pin.length === 4 && submitAttendance()} autoFocus />
            <input style={{ ...authStyles.input, textAlign: "center", letterSpacing: 8 }} type="password" inputMode="numeric" maxLength={4}
              placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))}
              onKeyDown={(e) => e.key === "Enter" && submitAttendance()} />
            {message && <div style={authStyles.error}>{message}</div>}
            <button style={authStyles.primaryBtn} onClick={submitAttendance} disabled={busy || !name.trim() || pin.length !== 4}>
              {busy ? "Please wait…" : "Present maaro"}
            </button>
          </>
        )}

        {stage === "success" && (
          <div style={authStyles.checkinSuccessBox}>✅ {message}</div>
        )}
        {stage === "error" && (
          <>
            <div style={authStyles.error}>{message}</div>
            <button style={authStyles.primaryBtn} onClick={() => setStage("form")}>Dobara try karo</button>
          </>
        )}

        <a href="#" onClick={(e) => { e.preventDefault(); goBack(); }} style={authStyles.checkinLink}>← Wapas login par jao</a>
      </div>
    </div>
  );
}

/* ---------------- catches crashes mid-session so the app never goes fully blank ---------------- */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("App crashed:", error, info && info.componentStack);
  }
  render() {
    if (this.state.error) {
      const msg = (this.state.error && this.state.error.message) ? this.state.error.message : String(this.state.error);
      return (
        <div style={{ maxWidth: 640, margin: "24px auto", padding: "18px 20px", background: "#fdece7", border: "1px solid #f0cfc5", borderRadius: 10, color: "#7a2f20", fontFamily: "'Inter', sans-serif" }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 8 }}>Kuch gadbad ho gayi — app crash ho gaya.</div>
          <div style={{ whiteSpace: "pre-wrap", fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace", marginBottom: 14, lineHeight: 1.5 }}>{msg}</div>
          <button
            onClick={() => window.location.reload()}
            style={{ background: "#E8C468", color: "#1F3D2B", border: "none", borderRadius: 7, padding: "9px 16px", fontWeight: 700, fontSize: 12.5, cursor: "pointer", fontFamily: "'Inter', sans-serif" }}
          >
            Reload App
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function Root() {
  const [sbConfig, setSbConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [signupClient, setSignupClient] = useState(null);
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [profile, setProfile] = useState(undefined); // undefined = checking, null = blocked, {role,...} = ok
  const [authBlockedMsg, setAuthBlockedMsg] = useState("");
  const [checkingConfig, setCheckingConfig] = useState(true);
  const [teacherOptions, setTeacherOptions] = useState([]);
  const [viewAsUserId, setViewAsUserId] = useState(""); // "" = apna data, otherwise a teacher's user id

  useEffect(() => {
    if (EMBEDDED_SUPABASE_URL && EMBEDDED_SUPABASE_ANON_KEY) {
      setSbConfig({ url: EMBEDDED_SUPABASE_URL, anonKey: EMBEDDED_SUPABASE_ANON_KEY });
    }
    setCheckingConfig(false);
  }, []);

  useEffect(() => {
    if (!sbConfig) return;
    try {
      const c = window.supabase.createClient(sbConfig.url, sbConfig.anonKey);
      setClient(c);
      // Separate, non-session-persisting client — purely so the admin can
      // create a class teacher's login (signUp) without getting signed out
      // of their own admin session in the process.
      setSignupClient(
        window.supabase.createClient(sbConfig.url, sbConfig.anonKey, {
          auth: { persistSession: false, autoRefreshToken: false },
        })
      );
      c.auth.getSession().then(({ data }) => setSession(data.session || null));
      const { data: sub } = c.auth.onAuthStateChange((_event, sess) => {
        setSession(sess || null);
      });
      return () => sub && sub.subscription && sub.subscription.unsubscribe();
    } catch (e) {
      setSession(null);
    }
  }, [sbConfig]);

  // Load the `profiles` row that decides admin vs class-teacher access.
  // If nobody has a profile yet (brand new project), the very first person
  // to log in automatically becomes admin — after that, only the admin can
  // create further (class teacher) logins from inside the app.
  useEffect(() => {
    if (!client || !session) {
      if (session === null) setProfile(null);
      return;
    }
    let cancelled = false;
    (async () => {
      setProfile(undefined);
      const { data: existing, error: existingErr } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (existing) {
        setProfile(existing);
        return;
      }
      if (existingErr) {
        setAuthBlockedMsg("Profile check me error aayi. [Debug: " + existingErr.message + (existingErr.code ? " (code: " + existingErr.code + ")" : "") + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        return;
      }
      // No profile row yet — try to bootstrap as the first admin. This only
      // succeeds (per RLS) if the profiles table is still completely empty.
      const { data: inserted, error: insertErr } = await client
        .from("profiles")
        .insert({ id: session.user.id, email: session.user.email, role: "admin" })
        .select()
        .maybeSingle();
      if (cancelled) return;
      if (!insertErr && inserted) {
        setProfile(inserted);
        return;
      }
      // A row for this id may already exist (e.g. an earlier attempt actually
      // succeeded but this check missed it) — re-fetch before giving up.
      if (insertErr && insertErr.code === "23505") {
        const { data: retryExisting } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
        if (cancelled) return;
        if (retryExisting) {
          setProfile(retryExisting);
          return;
        }
      }
      {
        const detail = insertErr ? (insertErr.message + (insertErr.code ? " (code: " + insertErr.code + ")" : "")) : "Row insert nahi hui.";
        setAuthBlockedMsg("Ye account admin dwara authorize nahi hai. Apne school admin se apna Entities Custodian login banwao. [Debug: " + detail + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
      }
    })();
    return () => { cancelled = true; };
  }, [client, session]);

  // Agar admin kisi teacher ka access hata de (profiles row delete kar de),
  // to jo teacher pehle se logged in hai uska session bhi jald khatam ho —
  // isliye har thodi der me aur tab wapas dekhne par profile dobara verify karo.
  useEffect(() => {
    if (!client || !session || !profile) return;
    const revalidate = async () => {
      const { data: still, error } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (error || !still) {
        setAuthBlockedMsg("Aapka access admin ne hata diya hai. Apne school admin se sampark karein.");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        setViewAsUserId("");
      }
    };
    const interval = setInterval(revalidate, 20000);
    const onVisible = () => { if (document.visibilityState === "visible") revalidate(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, [client, session, profile]);

  // Admin ke liye teacher accounts ki list — "kis teacher ka data dekhna/edit
  // karna hai" dropdown ke liye. Actual access RLS se milta hai (is_admin()),
  // ye list sirf UI me dikhane ke liye hai.
  useEffect(() => {
    if (!client || !profile || profile.role !== "admin") {
      setTeacherOptions([]);
      return;
    }
    let cancelled = false;
    client.from("profiles").select("*").eq("role", "teacher").order("created_at", { ascending: false }).then(({ data }) => {
      if (!cancelled && data) setTeacherOptions(data);
    });
    return () => { cancelled = true; };
  }, [client, profile]);

  const handleLogout = async () => {
    if (client) await client.auth.signOut();
    setSession(null);
    setProfile(null);
    setViewAsUserId("");
  };

  if (checkingConfig) return null;

  if (!sbConfig) {
    return (
      <div style={authStyles.wrap}>
        <div style={authStyles.card}>
          <div style={authStyles.title}>Supabase Not Configured</div>
          <div style={authStyles.subtitle}>App abhi kisi Supabase project se connect nahi hai. Developer ko URL aur anon key set karne hain.</div>
        </div>
      </div>
    );
  }

  if (!client || session === undefined) return null;

  if (new URLSearchParams(window.location.search).has("checkin")) {
    return <SelfCheckinScreen client={client} />;
  }

  if (!session) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} />;
  }

  if (profile === undefined) return null; // checking profile/role

  if (!profile) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} />;
  }

  const effectiveUserId = (profile.role === "admin" && viewAsUserId) ? viewAsUserId : session.user.id;
  window.storage = makeSupabaseStorage(client, effectiveUserId);

  const isAdmin = profile.role === "admin";
  const isTeacher = profile.role === "teacher";
  const viewingTeacher = isAdmin && viewAsUserId ? teacherOptions.find((t) => t.id === viewAsUserId) : null;
  const userLabel = viewingTeacher
    ? `Admin: ${session.user.email}`
    : isTeacher
    ? `Entities Custodian: ${session.user.email}`
    : session.user.email;
  const lockedTimeMode = viewingTeacher ? !!viewingTeacher.time_mode : (isTeacher ? !!profile.time_mode : null);

  return (
    <AttendanceApp
      key={effectiveUserId}
      userEmail={userLabel}
      isGuest={isTeacher}
      isAdmin={isAdmin}
      client={client}
      signupClient={signupClient}
      onLogout={handleLogout}
      teacherOptions={teacherOptions}
      viewAsUserId={viewAsUserId}
      onChangeViewAs={setViewAsUserId}
      viewingTeacherEmail={viewingTeacher ? viewingTeacher.email : null}
      lockedTimeMode={lockedTimeMode}
    />
  );
}

<script>
  // Manually transform + run the app source (instead of Babel's silent auto-scan of
  // type="text/babel" tags) so that ANY build/syntax error is guaranteed to surface
  // in the on-screen boot-error box, not just get swallowed into the console.
  (function () {
    const sourceEl = document.getElementById("app-source");
    const src = sourceEl.textContent;
    function showBootError(label, err) {
      const box = document.getElementById("boot-error");
      if (!box) return;
      box.style.display = "block";
      let detail = err && err.message ? err.message : String(err);
      if (err && err.loc) detail += "\n(line " + err.loc.line + ", col " + err.loc.column + ")";
      box.textContent = label + ": " + detail;
      console.error(label, err);
    }
    try {
      const { code } = Babel.transform(src, { presets: ["react"], filename: "app-source.jsx" });
      try {
        (0, eval)(code);
      } catch (runErr) {
        showBootError("App run error", runErr);
      }
    } catch (buildErr) {
      showBootError("Build error", buildErr);
    }
  })();
</script>
