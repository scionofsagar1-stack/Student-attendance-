<script>
  // ---- surface any error on-screen instead of a silent blank page ----
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    if (box) {
      box.style.display = "block";
      box.textContent = "Page load error: " + (e.message || e.error) +
        (e.filename ? "\n(" + e.filename + ":" + e.lineno + ")" : "") +
        "\n\nAgar ye CDN se related error hai to internet connection check karo, ya browser console (F12) khol kar poora error dekho.";
    }
  });

  // ---- storage polyfill (localStorage-backed, mirrors the window.storage API) ----
  window.storage = {
    get: async (key, shared) => {
      try {
        const v = localStorage.getItem(key);
        if (v === null || v === undefined) return null;
        return { key, value: v, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    set: async (key, value, shared) => {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    delete: async (key, shared) => {
      try {
        localStorage.removeItem(key);
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    list: async (prefix, shared) => {
      try {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
  };
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// Class delete ke liye Admin PIN (device-level). Admin isko header se badal sakta hai.
const DELETE_PIN_KEY = "attendance-app-delete-pin";
const DEFAULT_DELETE_PIN = "1234";

/* ---------------- inline icon set (lucide-style outline icons) ---------------- */
function makeIcon(paths) {
  return function Icon({ size = 16, color = "currentColor", style, ...rest }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color}
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        {...rest}
      >
        {paths}
      </svg>
    );
  };
}

/* ---------------- app logic (ported from the original .jsx) ---------------- */

const FONT_IMPORT = `@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');`;

const STORAGE_KEY = "attendance-app-store-v2";

const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const todayISO = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
};

const currentMonthStr = () => todayISO().slice(0, 7);
const currentYearStr = () => todayISO().slice(0, 4);
const newId = (p) => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

const STATUS = {
  P: { label: "Present", short: "P", color: "#4C8C5B" },
  A: { label: "Absent", short: "A", color: "#C1503D" },
  L: { label: "Leave", short: "L", color: "#4A6FA5" },
};

const blankClass = (name = "") => ({ id: newId("c"), className: name, teacher: "", students: [], attendance: {} });
const normalizeClasses = (list) =>
  (list || []).map((c) => ({
    ...c,
    students: (c.students || []).map((s) => ({ ...s, active: s.active === false ? false : true })),
  }));

function AttendanceApp({ userEmail, onLogout, isGuest, isAdmin, client, signupClient, teacherOptions = [], viewAsUserId, onChangeViewAs, viewingTeacherEmail }) {
  const [loaded, setLoaded] = useState(false);
  const [classes, setClasses] = useState([]);
  const [activeClassId, setActiveClassId] = useState(null);
  const [showNewClassForm, setShowNewClassForm] = useState(false);
  const [newClassName, setNewClassName] = useState("");

  const [showTeacherPanel, setShowTeacherPanel] = useState(false);
  const [teacherAccounts, setTeacherAccounts] = useState([]);
  const [teacherForm, setTeacherForm] = useState({ email: "", password: "" });
  const [teacherPanelError, setTeacherPanelError] = useState("");
  const [teacherSaving, setTeacherSaving] = useState(false);
  const [teacherLastCreated, setTeacherLastCreated] = useState(null);

  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [selectedMonth, setSelectedMonth] = useState(currentMonthStr());
  const [selectedYear, setSelectedYear] = useState(currentYearStr());
  const [selectedStudentId, setSelectedStudentId] = useState("");

  const [view, setView] = useState("enrollment");
  const [reportScope, setReportScope] = useState("month");

  const [newRoll, setNewRoll] = useState("");
  const [newName, setNewName] = useState("");
  const [bulkText, setBulkText] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editRoll, setEditRoll] = useState("");
  const [editName, setEditName] = useState("");
  const [saveError, setSaveError] = useState(false);
  const [justStamped, setJustStamped] = useState(null);
  const nameInputRef = useRef(null);

  // ---- load + migrate ----
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.classes && data.classes.length) {
            setClasses(normalizeClasses(data.classes));
            setActiveClassId(data.activeClassId || data.classes[0].id);
          } else {
            const c = blankClass();
            setClasses([c]);
            setActiveClassId(c.id);
          }
        } else {
          let migrated = null;
          try {
            const old = await window.storage.get("attendance-app-store-v1", false);
            if (old && old.value) {
              const od = JSON.parse(old.value);
              if (od.students || od.attendance) {
                migrated = blankClass(od.classInfo?.className || "");
                migrated.teacher = od.classInfo?.teacher || "";
                migrated.students = od.students || [];
                migrated.attendance = od.attendance || {};
              }
            }
          } catch (e) {}
          const c = migrated || blankClass();
          setClasses([c]);
          setActiveClassId(c.id);
        }
      } catch (e) {
        const c = blankClass();
        setClasses([c]);
        setActiveClassId(c.id);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const payload = JSON.stringify({ classes, activeClassId });
        const result = await window.storage.set(STORAGE_KEY, payload, false);
        setSaveError(!result);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [classes, activeClassId, loaded]);

  const activeClass = classes.find((c) => c.id === activeClassId) || null;
  const students = activeClass ? activeClass.students : [];
  const activeStudents = students.filter((s) => s.active !== false);
  const attendance = activeClass ? activeClass.attendance : {};
  const classInfo = { className: activeClass ? activeClass.className : "", teacher: activeClass ? activeClass.teacher : "" };

  const updateActive = (patchFn) => {
    setClasses((prev) => prev.map((c) => (c.id === activeClassId ? { ...c, ...patchFn(c) } : c)));
  };
  const setStudents = (updater) =>
    updateActive((c) => ({ students: typeof updater === "function" ? updater(c.students) : updater }));
  const setAttendance = (updater) =>
    updateActive((c) => ({ attendance: typeof updater === "function" ? updater(c.attendance) : updater }));
  const setClassInfo = (updater) =>
    updateActive((c) => {
      const cur = { className: c.className, teacher: c.teacher };
      const next = typeof updater === "function" ? updater(cur) : updater;
      return { className: next.className, teacher: next.teacher };
    });

  useEffect(() => {
    if (!selectedStudentId && students.length) setSelectedStudentId(students[0].id);
    if (selectedStudentId && !students.find((s) => s.id === selectedStudentId)) {
      setSelectedStudentId(students.length ? students[0].id : "");
    }
  }, [students, activeClassId]); // eslint-disable-line

  const addClass = () => {
    const name = newClassName.trim();
    const c = blankClass(name || `Class ${classes.length + 1}`);
    setClasses((prev) => [...prev, c]);
    setActiveClassId(c.id);
    setNewClassName("");
    setShowNewClassForm(false);
    setView("enrollment");
  };

  const deleteClass = () => {
    if (!activeClass || !isAdmin) return;
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const entered = window.prompt("Class delete karne ke liye Admin PIN daalo:");
    if (entered === null) return; // cancelled
    if (entered.trim() !== storedPin) {
      window.alert("Galat PIN. Class delete nahi hui.");
      return;
    }
    const ok = window.confirm(`"${activeClass.className || "Untitled Class"}" delete karein? Iska poora data (students + attendance) mit jaayega.`);
    if (!ok) return;
    setClasses((prev) => {
      const remaining = prev.filter((c) => c.id !== activeClassId);
      const list = remaining.length ? remaining : [blankClass()];
      setActiveClassId(list[0].id);
      return list;
    });
  };

  const changeDeletePin = () => {
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const current = window.prompt("Abhi ka Admin PIN daalo (default: " + DEFAULT_DELETE_PIN + "):");
    if (current === null) return;
    if (current.trim() !== storedPin) {
      window.alert("Galat PIN.");
      return;
    }
    const next = window.prompt("Naya PIN daalo (4-6 digit):");
    if (!next || !next.trim()) return;
    const confirmNext = window.prompt("Naya PIN dobara daalo (confirm):");
    if (next.trim() !== (confirmNext || "").trim()) {
      window.alert("Dono PIN match nahi hue. Kuch nahi badla.");
      return;
    }
    localStorage.setItem(DELETE_PIN_KEY, next.trim());
    window.alert("PIN update ho gaya.");
  };

  /* ---------- Class Teacher logins (admin-only) ----------
     Owner/admin creates a real Supabase Auth login (email + password) for
     each class teacher, exactly like the fee register app. Each teacher's
     data (classes/sections/students/attendance) stays fully isolated —
     Postgres RLS on app_storage already only ever returns rows belonging
     to whoever is logged in — so a teacher only ever sees the class(es)
     they themselves created. */
  const loadTeacherAccounts = async () => {
    if (!client) return;
    const { data, error } = await client
      .from("profiles").select("*").eq("role", "teacher").order("created_at", { ascending: false });
    if (!error && data) setTeacherAccounts(data);
  };

  const createTeacherAccount = async () => {
    const email = teacherForm.email.trim();
    const pwd = teacherForm.password.trim();
    setTeacherPanelError("");
    if (!email || !pwd) {
      setTeacherPanelError("Email aur password dono bharo.");
      return;
    }
    if (pwd.length < 6) {
      setTeacherPanelError("Password kam se kam 6 characters ka rakhein.");
      return;
    }
    setTeacherSaving(true);
    const { data: signUpData, error: signUpError } = await signupClient.auth.signUp({ email, password: pwd });
    if (signUpError || !signUpData.user) {
      setTeacherPanelError(signUpError ? signUpError.message : "Account nahi ban paaya.");
      setTeacherSaving(false);
      return;
    }
    const { error: profileError } = await client.from("profiles").insert({
      id: signUpData.user.id, email, role: "teacher",
    });
    if (profileError) {
      setTeacherPanelError("Account ban gaya lekin profile save nahi hui — Supabase me 'profiles' table check karein.");
    } else {
      setTeacherLastCreated({ email, password: pwd });
      setTeacherForm({ email: "", password: "" });
      await loadTeacherAccounts();
    }
    setTeacherSaving(false);
  };

  const deleteTeacherAccount = async (id) => {
    const ok = window.confirm("Is class teacher ka access hataayein? (Login abhi bhi Supabase me rahega, lekin ab kuch access nahi milega.)");
    if (!ok) return;
    setTeacherSaving(true);
    const { error } = await client.from("profiles").delete().eq("id", id);
    if (!error) await loadTeacherAccounts();
    setTeacherSaving(false);
  };

  useEffect(() => {
    if (isAdmin && showTeacherPanel) loadTeacherAccounts();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isAdmin, showTeacherPanel]);

  const nextAutoRoll = (list) => {
    const nums = list.map((s) => parseInt(s.roll, 10)).filter((n) => !isNaN(n));
    return nums.length ? String(Math.max(...nums) + 1) : "1";
  };

  const addStudent = () => {
    const name = newName.trim();
    if (!name) return;
    setStudents((prev) => {
      const roll = newRoll.trim() || nextAutoRoll(prev);
      return [...prev, { id: newId("s"), roll, name, active: true, enrolledAt: todayISO() }].sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }));
    });
    setNewRoll("");
    setNewName("");
    nameInputRef.current && nameInputRef.current.focus();
  };

  const addBulk = () => {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const today = todayISO();
    setStudents((prev) => {
      let list = [...prev];
      let counter = parseInt(nextAutoRoll(list), 10);
      lines.forEach((line) => {
        let roll, name;
        const m = line.match(/^(\d+)[.)\-\s]+(.*)$/);
        if (m) {
          roll = m[1];
          name = m[2].trim();
        } else {
          roll = String(counter);
          name = line;
        }
        counter = Math.max(counter, parseInt(roll, 10) || 0) + 1;
        list.push({ id: newId("s"), roll, name, active: true, enrolledAt: today });
      });
      return list.sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }));
    });
    setBulkText("");
  };

  const removeStudent = (id, name) => {
    if (!isAdmin) return;
    const storedPin = localStorage.getItem(DELETE_PIN_KEY) || DEFAULT_DELETE_PIN;
    const entered = window.prompt(`"${name || "Student"}" ko delete karne ke liye Admin PIN daalo:`);
    if (entered === null) return; // cancelled
    if (entered.trim() !== storedPin) {
      window.alert("Galat PIN. Student delete nahi hua.");
      return;
    }
    setStudents((prev) => prev.filter((s) => s.id !== id));
    setAttendance((prev) => {
      const copy = { ...prev };
      Object.keys(copy).forEach((date) => {
        if (copy[date] && copy[date][id] !== undefined) {
          const dayCopy = { ...copy[date] };
          delete dayCopy[id];
          copy[date] = dayCopy;
        }
      });
      return copy;
    });
  };

  const toggleActive = (id) => {
    setStudents((prev) => prev.map((s) => (s.id === id ? { ...s, active: s.active === false ? true : false } : s)));
  };

  const startEdit = (s) => {
    setEditingId(s.id);
    setEditRoll(s.roll);
    setEditName(s.name);
  };

  const saveEdit = (id) => {
    setStudents((prev) =>
      prev
        .map((s) => (s.id === id ? { ...s, roll: editRoll.trim() || s.roll, name: editName.trim() || s.name } : s))
        .sort((a, b) => a.roll.localeCompare(b.roll, undefined, { numeric: true }))
    );
    setEditingId(null);
  };

  const markStatus = (studentId, status) => {
    setAttendance((prev) => {
      const day = { ...(prev[selectedDate] || {}) };
      day[studentId] = day[studentId] === status ? undefined : status;
      if (day[studentId] === undefined) delete day[studentId];
      return { ...prev, [selectedDate]: day };
    });
    setJustStamped(studentId + status);
    setTimeout(() => setJustStamped(null), 380);
  };

  const markAllStatus = (status) => {
    if (!activeStudents.length) return;
    setAttendance((prev) => {
      const day = { ...(prev[selectedDate] || {}) };
      activeStudents.forEach((s) => {
        day[s.id] = status;
      });
      return { ...prev, [selectedDate]: day };
    });
  };

  const toggleAllPresent = () => {
    if (!activeStudents.length) return;
    const day = attendance[selectedDate] || {};
    const allPresent = activeStudents.every((s) => day[s.id] === "P");
    setAttendance((prev) => {
      const nextDay = { ...(prev[selectedDate] || {}) };
      activeStudents.forEach((s) => {
        if (allPresent) {
          delete nextDay[s.id];
        } else {
          nextDay[s.id] = "P";
        }
      });
      return { ...prev, [selectedDate]: nextDay };
    });
  };


  const dayRecord = attendance[selectedDate] || {};
  const presentCount = activeStudents.filter((s) => dayRecord[s.id] === "P").length;
  const absentCount = activeStudents.filter((s) => dayRecord[s.id] === "A").length;
  const leaveCount = activeStudents.filter((s) => dayRecord[s.id] === "L").length;
  const markedCount = presentCount + absentCount + leaveCount;
  const pct = activeStudents.length ? Math.round((presentCount / activeStudents.length) * 100) : 0;

  const shiftDate = (deltaDays) => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + deltaDays);
    setSelectedDate(d.toISOString().slice(0, 10));
  };
  const shiftMonth = (delta) => {
    const [y, m] = selectedMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setSelectedMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const shiftYear = (delta) => setSelectedYear(String(parseInt(selectedYear, 10) + delta));

  const formatDateLabel = (iso) => {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  };
  const monthLabel = useMemo(() => {
    const [y, m] = selectedMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  }, [selectedMonth]);

  const statsForDates = (studentId, dates) => {
    let present = 0, absent = 0, leave = 0;
    dates.forEach((d) => {
      const st = attendance[d] && attendance[d][studentId];
      if (st === "P") present++;
      else if (st === "A") absent++;
      else if (st === "L") leave++;
    });
    const total = present + absent + leave;

const SETUP_SQL = `create table if not exists app_storage (
  user_id uuid references auth.users(id) on delete cascade not null,
  key text not null,
  value text,
  updated_at timestamptz default now(),
  primary key (user_id, key)
);

alter table app_storage enable row level security;

-- Class Teacher login system (owner sets up each teacher's login;
-- role decides admin vs class-teacher view — same pattern as the fee register app).
create table if not exists profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text,
  role text not null check (role in ('admin','teacher')),
  created_at timestamptz default now()
);

alter table profiles enable row level security;

-- Security definer function to check "is the current user an admin" without
-- causing infinite RLS recursion when used inside profiles' own policies.
create or replace function public.is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists (
    select 1 from profiles where id = auth.uid() and role = 'admin'
  );
$$;

-- Admin can fully view/edit ANY teacher's class data; everyone else only their own.
create policy "Users manage own data, admin manages all"
on app_storage for all
using (auth.uid() = user_id or public.is_admin())
with check (auth.uid() = user_id or public.is_admin());

create policy "Read own profile"
on profiles for select
using (auth.uid() = id);

create policy "Admin reads all profiles"
on profiles for select
using (public.is_admin());

create policy "Admin inserts teacher profiles"
on profiles for insert
with check (public.is_admin());

create policy "Admin deletes teacher profiles"
on profiles for delete
using (public.is_admin());

-- The very first person to ever log in (jab profiles table khali ho) apne aap
-- 'admin' ban jaata hai — is se pehla owner account manually SQL se banane
-- ki zaroorat nahi padti. Uske baad admin hi teacher logins bana sakta hai.
create policy "Bootstrap first admin"
on profiles for insert
with check (auth.uid() = id and not exists (select 1 from profiles));`;

function makeSupabaseStorage(client, userId) {
  return {
    get: async (key) => {
      try {
        const { data, error } = await client
          .from("app_storage")
          .select("value")
          .eq("user_id", userId)
          .eq("key", key)
          .maybeSingle();
        if (error || !data) return null;
        return { key, value: data.value };
      } catch (e) {
        return null;
      }
    },
    set: async (key, value) => {
      try {
        const { error } = await client
          .from("app_storage")
          .upsert({ user_id: userId, key, value, updated_at: new Date().toISOString() }, { onConflict: "user_id,key" });
        if (error) return null;
        return { key, value };
      } catch (e) {
        return null;
      }
    },
    delete: async (key) => {
      try {
        const { error } = await client.from("app_storage").delete().eq("user_id", userId).eq("key", key);
        return error ? null : { key, deleted: true };
      } catch (e) {
        return null;
      }
    },
    list: async (prefix) => {
      try {
        let q = client.from("app_storage").select("key").eq("user_id", userId);
        if (prefix) q = q.like("key", prefix + "%");
        const { data, error } = await q;
        if (error) return null;
        return { keys: (data || []).map((r) => r.key), prefix };
      } catch (e) {
        return null;
      }
    },
  };
}

function AuthScreen({ client, onAuthed, blockedError }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    setErr("");
    const em = email.trim();
    if (!em || !password) {
      setErr("Email aur password dono bharo.");
      return;
    }
    if (password.length < 6) {
      setErr("Password kam se kam 6 characters ka ho.");
      return;
    }
    setLoading(true);
    try {
      const { error } = await client.auth.signInWithPassword({ email: em, password });
      if (error) {
        setErr(error.message);
      } else {
        onAuthed();
      }
    } catch (e) {
      setErr("Kuch galat ho gaya: " + (e && e.message ? e.message : e));
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={authStyles.wrap}>
      <div style={authStyles.card}>
        <div style={authStyles.title}>उपस्थिति रजिस्टर</div>
        <div style={authStyles.subtitle}>Login karke apna attendance data access karo</div>

        <input style={authStyles.input} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} autoCapitalize="off" autoCorrect="off" />
        <input style={authStyles.input} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()} />

        {err && <div style={authStyles.error}>{err}</div>}
        {blockedError && <div style={authStyles.error}>{blockedError}</div>}

        <button style={authStyles.primaryBtn} onClick={submit} disabled={loading}>
          {loading ? "Please wait…" : "Login"}
        </button>
      </div>
    </div>
  );
}

function Root() {
  const [sbConfig, setSbConfig] = useState(null);
  const [client, setClient] = useState(null);
  const [signupClient, setSignupClient] = useState(null);
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [profile, setProfile] = useState(undefined); // undefined = checking, null = blocked, {role,...} = ok
  const [authBlockedMsg, setAuthBlockedMsg] = useState("");
  const [checkingConfig, setCheckingConfig] = useState(true);
  const [teacherOptions, setTeacherOptions] = useState([]);
  const [viewAsUserId, setViewAsUserId] = useState(""); // "" = apna data, otherwise a teacher's user id

  useEffect(() => {
    if (EMBEDDED_SUPABASE_URL && EMBEDDED_SUPABASE_ANON_KEY) {
      setSbConfig({ url: EMBEDDED_SUPABASE_URL, anonKey: EMBEDDED_SUPABASE_ANON_KEY });
      setCheckingConfig(false);
      return;
    }
    const u = localStorage.getItem(SB_URL_KEY);
    const k = localStorage.getItem(SB_ANON_KEY);
    if (u && k) setSbConfig({ url: u, anonKey: k });
    setCheckingConfig(false);
  }, []);

  useEffect(() => {
    if (!sbConfig) return;
    try {
      const c = window.supabase.createClient(sbConfig.url, sbConfig.anonKey);
      setClient(c);
      // Separate, non-session-persisting client — purely so the admin can
      // create a class teacher's login (signUp) without getting signed out
      // of their own admin session in the process.
      setSignupClient(
        window.supabase.createClient(sbConfig.url, sbConfig.anonKey, {
          auth: { persistSession: false, autoRefreshToken: false },
        })
      );
      c.auth.getSession().then(({ data }) => setSession(data.session || null));
      const { data: sub } = c.auth.onAuthStateChange((_event, sess) => {
        setSession(sess || null);
      });
      return () => sub && sub.subscription && sub.subscription.unsubscribe();
    } catch (e) {
      setSession(null);
    }
  }, [sbConfig]);

  // Load the `profiles` row that decides admin vs class-teacher access.
  // If nobody has a profile yet (brand new project), the very first person
  // to log in automatically becomes admin — after that, only the admin can
  // create further (class teacher) logins from inside the app.
  useEffect(() => {
    if (!client || !session) {
      if (session === null) setProfile(null);
      return;
    }
    let cancelled = false;
    (async () => {
      setProfile(undefined);
      const { data: existing, error: existingErr } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (cancelled) return;
      if (existing) {
        setProfile(existing);
        return;
      }
      if (existingErr) {
        setAuthBlockedMsg("Profile check me error aayi. [Debug: " + existingErr.message + (existingErr.code ? " (code: " + existingErr.code + ")" : "") + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        return;
      }
      // No profile row yet — try to bootstrap as the first admin. This only
      // succeeds (per RLS) if the profiles table is still completely empty.
      const { data: inserted, error: insertErr } = await client
        .from("profiles")
        .insert({ id: session.user.id, email: session.user.email, role: "admin" })
        .select()
        .maybeSingle();
      if (cancelled) return;
      if (!insertErr && inserted) {
        setProfile(inserted);
        return;
      }
      // A row for this id may already exist (e.g. an earlier attempt actually
      // succeeded but this check missed it) — re-fetch before giving up.
      if (insertErr && insertErr.code === "23505") {
        const { data: retryExisting } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
        if (cancelled) return;
        if (retryExisting) {
          setProfile(retryExisting);
          return;
        }
      }
      {
        const detail = insertErr ? (insertErr.message + (insertErr.code ? " (code: " + insertErr.code + ")" : "")) : "Row insert nahi hui.";
        setAuthBlockedMsg("Ye account admin dwara authorize nahi hai. Apne school admin se apna Class Teacher login banwao. [Debug: " + detail + "]");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
      }
    })();
    return () => { cancelled = true; };
  }, [client, session]);

  // Agar admin kisi teacher ka access hata de (profiles row delete kar de),
  // to jo teacher pehle se logged in hai uska session bhi jald khatam ho —
  // isliye har thodi der me aur tab wapas dekhne par profile dobara verify karo.
  useEffect(() => {
    if (!client || !session || !profile) return;
    const revalidate = async () => {
      const { data: still, error } = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
      if (error || !still) {
        setAuthBlockedMsg("Aapka access admin ne hata diya hai. Apne school admin se sampark karein.");
        await client.auth.signOut();
        setProfile(null);
        setSession(null);
        setViewAsUserId("");
      }
    };
    const interval = setInterval(revalidate, 20000);
    const onVisible = () => { if (document.visibilityState === "visible") revalidate(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
  }, [client, session, profile]);

  // Admin ke liye teacher accounts ki list — "kis teacher ka data dekhna/edit
  // karna hai" dropdown ke liye. Actual access RLS se milta hai (is_admin()),
  // ye list sirf UI me dikhane ke liye hai.
  useEffect(() => {
    if (!client || !profile || profile.role !== "admin") {
      setTeacherOptions([]);
      return;
    }
    let cancelled = false;
    client.from("profiles").select("*").eq("role", "teacher").order("created_at", { ascending: false }).then(({ data }) => {
      if (!cancelled && data) setTeacherOptions(data);
    });
    return () => { cancelled = true; };
  }, [client, profile]);

  const handleLogout = async () => {
    if (client) await client.auth.signOut();
    setSession(null);
    setProfile(null);
    setViewAsUserId("");
  };

  if (checkingConfig) return null;

  if (!sbConfig) {
    return <SetupScreen onDone={(url, anonKey) => setSbConfig({ url, anonKey })} />;
  }

  if (!client || session === undefined) return null;

  if (!session) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} />;
  }

  if (profile === undefined) return null; // checking profile/role

  if (!profile) {
    return <AuthScreen client={client} onAuthed={() => setAuthBlockedMsg("")} blockedError={authBlockedMsg} />;
  }

  const effectiveUserId = (profile.role === "admin" && viewAsUserId) ? viewAsUserId : session.user.id;
  window.storage = makeSupabaseStorage(client, effectiveUserId);

  const isAdmin = profile.role === "admin";
  const isTeacher = profile.role === "teacher";
  const viewingTeacher = isAdmin && viewAsUserId ? teacherOptions.find((t) => t.id === viewAsUserId) : null;
  const userLabel = viewingTeacher
    ? `Admin: ${session.user.email}`
    : isTeacher
    ? `Class Teacher: ${session.user.email}`
    : session.user.email;

  return (
    <AttendanceApp
      key={effectiveUserId}
      userEmail={userLabel}
      isGuest={isTeacher}
      isAdmin={isAdmin}
      client={client}
      signupClient={signupClient}
      onLogout={handleLogout}
      teacherOptions={teacherOptions}
      viewAsUserId={viewAsUserId}
      onChangeViewAs={setViewAsUserId}
      viewingTeacherEmail={viewingTeacher ? viewingTeacher.email : null}
    />
  );
}

  root.render(<Root />);
} catch (err) {
  const box = document.getElementById("boot-error");
  box.style.display = "block";
  box.textContent = "App render error: " + (err && err.message ? err.message : err);
  console.error(err);

    window.addEventListener("load", () => {

    });
  }
</script>
